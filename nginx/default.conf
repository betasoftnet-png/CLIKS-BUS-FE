server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve uploaded receipts, images, and PDFs directly as static assets
    location /uploads/ {
        alias /var/www/cliks/uploads/;  # path where uploaded files reside
        access_log off;
        expires 30d;
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # SPA catch-all (remains below)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
