name: Build and Deploy CLIKS Business FE

on:
  push:
    branches:
      - main

  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/betasoftnet-png/cliks-business-fe

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_CALCULATOR_API_BASE_URL=${{ secrets.VITE_CALCULATOR_API_BASE_URL }}
            VITE_CONTACT_API_BASE_URL=${{ secrets.VITE_CONTACT_API_BASE_URL }}
            VITE_CALENDAR_API_BASE_URL=${{ secrets.VITE_CALENDAR_API_BASE_URL }}
            VITE_NOTES_API_BASE_URL=${{ secrets.VITE_NOTES_API_BASE_URL }}
            VITE_OPEN_METEO_API=${{ secrets.VITE_OPEN_METEO_API }}
            VITE_BIGDATA_CLOUD_API=${{ secrets.VITE_BIGDATA_CLOUD_API }}

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 204.168.244.118
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/CLIKS-BUS-FE

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u betasoftnet-png --password-stdin

            docker compose pull

            docker compose up -d --force-recreate

            echo "Deployment completed."

            docker ps --filter name=cliks-business-fe
